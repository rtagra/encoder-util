<main><div class="card">
<label for="rx-pattern">Regular expression</label><input id="rx-pattern" type="text" placeholder="\b([A-Za-z0-9._%+-]+)@([A-Za-z0-9.-]+\.[A-Za-z]{2,})\b" style="width:100%">

<div><button onclick="rxTest()">Test</button><button class="secondary" onclick="rxReplace()">Replace</button><button class="secondary" onclick="rxSample()">Load sample</button><button class="secondary" onclick="rxClear()">Clear</button></div>
<label for="rx-replacement">Replacement (for Replace — $1, $2 are capture groups)</label><input id="rx-replacement" type="text" placeholder="$1 [at] $2" style="width:100%">

<label>Matches highlighted</label><div id="rx-highlight" style="border:1px solid #334155;border-radius:6px;padding:10px;min-height:40px;white-space:pre-wrap"></div>
<label for="rx-matches">Matches</label><textarea id="rx-matches" readonly style="min-height:100px"></textarea>

<button class="secondary" data-copy="rx-output" onclick="copyText('rx-output')">Copy replace output</button>
