<div class="tabs" role="tablist" aria-label="Encoders tools">

<section class="tab-panel" id="url" role="tabpanel" aria-labelledby="tab-url">
<div class="card">
<label><input type="radio" name="url-mode" value="component" checked> encodeURIComponent — for a query value / component</label>
<label><input type="radio" name="url-mode" value="full"> encodeURI — for a full URL (keeps : / ? &amp; =)</label>
<label for="url-input">Input</label><textarea id="url-input" placeholder="https://example.com/search?q=hello world&amp;lang=en"></textarea>
<div><button onclick="doEncode()">Encode</button><button class="secondary" onclick="doDecode()">Decode</button><button class="secondary" onclick="swapUrl()">Swap</button></div>
<p id="url-error"></p>
<label for="url-output">Output</label><textarea id="url-output" readonly></textarea>
<button class="secondary" data-copy="url-output" onclick="copyText('url-output')">Copy output</button>
</div>
</section>
<section class="tab-panel" id="base64" role="tabpanel" aria-labelledby="tab-base64">
<div class="card">
<label><input type="checkbox" id="b64-urlsafe"> URL-safe Base64 (- _ instead of + /, no padding)</label>
<label for="b64-input">Input</label><textarea id="b64-input" placeholder="Hello, world — Unicode works too"></textarea>
<div><button onclick="b64DoEncode()">Encode</button><button class="secondary" onclick="b64DoDecode()">Decode</button><button class="secondary" onclick="swapB64()">Swap</button></div>
<p id="b64-error"></p>
<label for="b64-output">Output</label><textarea id="b64-output" readonly></textarea>
<button class="secondary" data-copy="b64-output" onclick="copyText('b64-output')">Copy output</button>
</div>
</section>
<section class="tab-panel" id="hex-base64" role="tabpanel" aria-labelledby="tab-hex-base64">
<div class="card">
<label><input type="checkbox" id="hex-urlsafe"> URL-safe Base64 output (- _ , no padding)</label>
<label for="hex-input">Input — hex, or Base64</label><textarea id="hex-input" placeholder="48656c6c6f or SGVsbG8="></textarea>
<div><button onclick="hexToB64()">Hex → Base64</button><button class="secondary" onclick="b64ToHex()">Base64 → Hex</button><button class="secondary" onclick="swapHex()">Swap</button></div>
<p id="hex-error"></p>
<label for="hex-output">Output</label><textarea id="hex-output" readonly></textarea>
<button class="secondary" data-copy="hex-output" onclick="copyText('hex-output')">Copy output</button>
</div>
</section>
