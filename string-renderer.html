<p class="muted">Paste a string, render it in a read-only view — you can copy it, but you can't accidentally edit it. Useful for long tokens, JSON, HTML, or log lines you want to inspect safely.</p></header>
<main><div class="card">
<label><input type="radio" name="str-mode" value="raw" checked> Raw — as-is</label>
<label><input type="radio" name="str-mode" value="escaped"> HTML-escaped — shows &lt; &gt; &amp; as text</label>
<label><input type="radio" name="str-mode" value="json"> JSON-escaped — as a JSON string, with quotes</label>
<label for="str-input">Input string</label><textarea id="str-input" placeholder="Paste your string here…"></textarea>
<div><button onclick="renderString()">Render (read-only)</button></div>
<p id="str-error"></p>
<p id="str-stats" class="muted"></p>
<label>Rendered output — read-only</label>
<pre id="str-output" style="min-height:120px" tabindex="0"></pre>
<button class="secondary" data-copy="str-output" onclick="copyText('str-output')">Copy rendered text</button>
